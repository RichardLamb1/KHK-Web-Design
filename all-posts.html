<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All News - KHK | Kappa Eta Kappa | Delta Chapter</title>

    <script>
        (function () {
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-bs-theme', prefersDark ? 'dark' : 'light');
        })();
    </script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body>
    <!-- Navigation Bar (see js/navbar.js) -->
    <div id="site-navbar"></div>
    <script src="js/navbar.js"></script>

    <main>
        <div class="container">
            <section class="news-hero">
                <a href="newspage.html" class="back-to-news-link"><i class="fas fa-arrow-left me-1"></i>Back to News</a>
                <h1 class="display-5 fw-bold mb-3">All News &amp; Updates</h1>
                <p class="lead mb-4">Every post from Kappa Eta Kappa, Delta Chapter, newest first.</p>
            </section>

            <p id="newsLoading" class="news-loading">Loading posts&hellip;</p>
            <p id="newsEmpty" class="news-empty d-none">No posts yet &mdash; check back soon!</p>

            <section id="newsContent" class="d-none pb-5">
                <div id="allPostsList" class="all-posts-list"></div>
            </section>
        </div>

    <!-- Footer -->
    <div id="site-footer"></div>
    <script src="js/footer.js"></script>

    <script src="js/posts-engine.js"></script>
    <script src="js/all-posts.js"></script>

</html>
