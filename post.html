<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - KHK | Kappa Eta Kappa | Delta Chapter</title>

    <script>
        (function () {
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-bs-theme', prefersDark ? 'dark' : 'light');
        })();
    </script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/news.css">
</head>
<body>
    <!-- Navigation Bar (see js/navbar.js) -->
    <div id="site-navbar"></div>
    <script src="js/navbar.js"></script>

    <main>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">

                    <p id="newsLoading" class="news-loading">Loading post&hellip;</p>

                    <div id="postNotFound" class="post-not-found d-none">
                        <h1 class="mb-3">Post Not Found</h1>
                        <p class="mb-4">We couldn't find the post you were looking for. It may have been removed.</p>
                        <a href="newspage.html" class="btn btn-primary">Back to News</a>
                    </div>

                    <article id="postContent" class="d-none py-4">
                        <a href="newspage.html" id="backButton" class="post-back-button">
                            <i class="fas fa-arrow-left"></i> Back to News
                        </a>

                        <header class="post-header mb-4">
                            <img id="postImage" class="post-header-image" src="" alt="">
                            <span id="postDate" class="post-date"></span>
                            <h1 id="postTitle" class="post-header-title"></h1>
                        </header>

                        <div id="postBody" class="post-body"></div>

                        <p id="postAuthor" class="post-author"></p>
                    </article>

                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="site-footer"></div>
    <script src="js/footer.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="js/main.js"></script>
    <script src="js/posts-manifest.js"></script>
    <script src="js/posts-engine.js"></script>
    <script src="js/post.js"></script>
</body>
</html>
