<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - KHK | Kappa Eta Kappa | Delta Chapter</title>

    <script>
        (function () {
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-bs-theme', prefersDark ? 'dark' : 'light');
        })();
    </script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/news.css">
</head>
<body>
    <!-- Navigation Bar (see js/navbar.js) -->
    <div id="site-navbar"></div>
    <script src="js/navbar.js"></script>

    <main>
        <div class="container">
            <!-- Page Header -->
            <section class="news-hero text-center">
                <h1 class="display-4 fw-bold mb-3">News &amp; Updates</h1>
                <p class="lead mb-0">The latest from Kappa Eta Kappa, Delta Chapter &mdash; events, socials, and everything in between.</p>
            </section>

            <!-- Loading / empty states -->
            <p id="newsLoading" class="news-loading">Loading the latest news&hellip;</p>
            <p id="newsEmpty" class="news-empty d-none">No posts yet &mdash; check back soon!</p>

            <!-- Posts -->
            <section id="newsContent" class="d-none pb-5">
                <div class="news-section-heading">
                    <h2>Latest News</h2>
                    <a href="all-posts.html" class="view-all-link">View All Posts <i class="fas fa-arrow-right ms-1"></i></a>
                </div>

                <div class="row g-4">
                    <div class="col-lg-7">
                        <div id="featuredPost"></div>
                    </div>
                    <div class="col-lg-5">
                        <div id="postRowList" class="post-row-list"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <div id="site-footer"></div>
    <script src="js/footer.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="js/main.js"></script>
    <script src="js/posts-manifest.js"></script>
    <script src="js/posts-engine.js"></script>
    <script src="js/newspage.js"></script>
</body>
</html>
